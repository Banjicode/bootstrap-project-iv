<body>


  <section class="min-vh-100 py-4 px-2 p-md-4 d-flex align-items-center justify-content-center"

    <div class="container h-100 bg-transparent d-flex flex-column justify-content-between p-0"

      <section class="row flex-shrink-0 mb-3">
        <div class="col-12">
          <div class="text-center fw-bold fs-3 text-white py-3 d-flex align-items-center justify-content-center"

          </div>

            Aside
          </div>
        </section>


        <section class="col-sm-8 d-flex">

            <div class="text-center fw-bold fs-3 mt-auto mb-3 flex-shrink-0 pt-4 pt-sm-0">

            </div>


            <section class="row g-3 mb-3 pb-3 pb-sm-0">
              <!-- nested column image item 1 -->
              <div class="col-4">
                <div class="text-center fw-bold text-white fs-5 w-100 d-flex align-items-center justify-content-center"
                  style="background-color: #ffe082; height: 158px;">
                  Image
                </div>
              </div>

              <div class="col-4">
                <div class="text-center fw-bold text-white fs-5 w-100 d-flex align-items-center justify-content-center"
                  style="background-color: #ffe082; height: 158px;">
                  Image
                </div>
              </div>

              <div class="col-4">
                <div class="text-center fw-bold text-white fs-5 w-100 d-flex align-items-center justify-content-center"
                  style="background-color: #ffe082; height: 158px;">
                  Image
                </div>
              </div>
            </section>

          </div>
        </section>

      </section>

      <footer class="row flex-shrink-0">
        <div class="col-12">
          <div class="text-center fw-bold fs-3 text-white py-3 d-flex align-items-center justify-content-center"
            style="background-color: #00bfa5; min-height: 70px;">
            Footer

        </div>
